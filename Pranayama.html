<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents pinch-to-zoom on mobile to maintain app-like feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pranayama Breathing Timer</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #2dd4bf;
            --accent-glow: rgba(45, 212, 191, 0.15);
            --accent-border: rgba(45, 212, 191, 0.4);
            --btn-start: #10b981;
            --btn-start-hover: #059669;
            --btn-stop: #ef4444;
            --btn-stop-hover: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Removes blue tap highlight on mobile Chrome */
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            /* 100dvh fixes the layout jumping when Chrome's URL bar hides/shows */
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }

        .settings-panel {
            background-color: var(--bg-panel);
            padding: 1.25rem;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Custom styling for the Select Dropdown so it looks good on Mobile */
        select {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            /* Custom dropdown arrow */
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }
        
        select:focus {
            border-color: var(--accent);
        }

        select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.5rem;
        }

        .toggle-container label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Fluid, mobile-responsive breathing display */
        .display-area {
            position: relative;
            /* Scales cleanly on tiny screens, maxes out at 240px */
            width: clamp(200px, 55vw, 240px);
            height: clamp(200px, 55vw, 240px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 3.5rem; 
            margin-top: 1rem;
        }

        .breath-circle {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background-color: var(--accent-glow);
            border: 2px solid var(--accent-border);
            z-index: 0;
            transform: scale(1);
        }

        .timer-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        #phaseText {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 0.25rem;
            transition: opacity 0.3s;
        }

        #countdown {
            /* Scales the font size so it doesn't overflow the circle on small screens */
            font-size: clamp(3.5rem, 12vw, 5rem);
            font-weight: 200;
            line-height: 1;
            font-variant-numeric: tabular-nums; 
        }

        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 1.15rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.96); /* Slightly deeper push effect for touch screens */
        }

        #startBtn { background-color: var(--btn-start); }
        #startBtn:hover { background-color: var(--btn-start-hover); }
        #stopBtn { background-color: var(--btn-stop); }
        #stopBtn:hover { background-color: var(--btn-stop-hover); }
        
        #stopBtn:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pranayama</h1>

        <div class="settings-panel">
            <div class="form-group">
                <label for="ratioSelect">Breathing Ratio (In - Hold - Ex)</label>
                <select id="ratioSelect">
                    <option value="4,16,8">Option A: 4 - 16 - 8 (Relaxation)</option>
                    <option value="5,20,10">Option B: 5 - 20 - 10 (Deep Calming)</option>
                    <option value="10,10,10">Option C: 10 - 10 - 10 (Box Variation)</option>
                    <option value="20,20,20">Option D: 20 - 20 - 20 (Advanced)</option>
                </select>
            </div>
            
            <div class="form-group toggle-container">
                <label for="voiceToggle">Voice Announcements</label>
                <label class="switch">
                    <input type="checkbox" id="voiceToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="display-area">
            <div class="breath-circle" id="breathCircle"></div>
            <div class="timer-content">
                <div id="phaseText">Ready</div>
                <div id="countdown">--</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>
    </div>

    <script>
        // --- State Variables ---
        let audioCtx;
        let audioInitialized = false;
        
        let timerId = null;
        let isRunning = false;
        let expectedNextTickTime = 0; 
        
        let currentRatioArr = [];
        let currentPhaseIndex = 0; 
        let timeLeft = 0;
        let wakeLock = null; // Used to keep mobile screens awake
        
        const phases = ["Inhale", "Hold", "Exhale"];
        window.currentUtterance = null; 
        
        // --- DOM Elements ---
        const ratioSelect = document.getElementById('ratioSelect');
        const voiceToggle = document.getElementById('voiceToggle');
        const phaseTextEl = document.getElementById('phaseText');
        const countdownEl = document.getElementById('countdown');
        const breathCircle = document.getElementById('breathCircle');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // --- Wake Lock (Keeps mobile screen on) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock permission denied:', err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // Re-request wake lock if the user minimizes Chrome and comes back
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
                await requestWakeLock();
            }
        });

        // --- Audio Initialization ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!audioInitialized) {
                const silent = new SpeechSynthesisUtterance('');
                silent.volume = 0;
                window.speechSynthesis.speak(silent);
                audioInitialized = true;
            }
        }

        // --- Sound Effects ---
        function playChime() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;

            const createBellNode = (freq, gainVal) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(gainVal, t + 0.03); 
                gain.gain.exponentialRampToValueAtTime(0.001, t + 4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 4);
            };

            createBellNode(432, 0.4);       
            createBellNode(432 * 2.01, 0.2); 
            createBellNode(432 * 2.98, 0.1); 
        }

        // --- Voice Announcements ---
        function speakText(text) {
            if (!voiceToggle.checked) return;
            
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            
            window.currentUtterance = new SpeechSynthesisUtterance(text);
            window.currentUtterance.rate = 1.35; 
            window.currentUtterance.pitch = 0.95; 
            window.speechSynthesis.speak(window.currentUtterance);
        }

        // --- UI Updates ---
        function updateDisplay() {
            phaseTextEl.innerText = phases[currentPhaseIndex];
            countdownEl.innerText = timeLeft;
        }

        function setCircleAnimation(phaseIndex, duration) {
            // Note: 1.35 scale is safer for small mobile screens so it doesn't clip the edges
            if (phaseIndex === 0) {
                breathCircle.style.transition = `transform ${duration}s ease-in-out`;
                breathCircle.style.transform = 'scale(1.35)';
            } else if (phaseIndex === 1) {
                breathCircle.style.transition = 'none';
                breathCircle.style.transform = 'scale(1.35)';
            } else if (phaseIndex === 2) {
                breathCircle.style.transition = `transform ${duration}s ease-in-out`;
                breathCircle.style.transform = 'scale(1)';
            }
        }

        function resetUI() {
            phaseTextEl.innerText = "Ready";
            countdownEl.innerText = "--";
            breathCircle.style.transition = 'transform 0.5s ease-in-out';
            breathCircle.style.transform = 'scale(1)';
            ratioSelect.disabled = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        // --- Timer Logic ---
        function handlePhaseTransition() {
            currentPhaseIndex = (currentPhaseIndex + 1) % 3;
            timeLeft = currentRatioArr[currentPhaseIndex];
            
            playChime();
            speakText(phases[currentPhaseIndex]);
            
            setCircleAnimation(currentPhaseIndex, timeLeft);
            updateDisplay();
        }

        function exactTick() {
            if (!isRunning) return;

            timeLeft--;

            if (timeLeft <= 0) {
                handlePhaseTransition();
            } else {
                speakText(timeLeft.toString());
                updateDisplay();
            }

            if (isRunning) {
                expectedNextTickTime += 1000;
                const drift = performance.now() - expectedNextTickTime;
                const nextDelay = Math.max(0, 1000 - drift); 
                timerId = setTimeout(exactTick, nextDelay);
            }
        }

        async function startTimer() {
            if (isRunning) return;
            
            initAudio();
            await requestWakeLock(); // Request screen to stay awake
            
            isRunning = true;
            ratioSelect.disabled = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            currentRatioArr = ratioSelect.value.split(',').map(Number);
            currentPhaseIndex = 0;
            timeLeft = currentRatioArr[0];
            
            updateDisplay();
            playChime();
            speakText(phases[0]); 
            setCircleAnimation(0, timeLeft);

            expectedNextTickTime = performance.now() + 1000;
            timerId = setTimeout(exactTick, 1000);
        }

        function stopTimer() {
            if (!isRunning) return;
            
            clearTimeout(timerId);
            timerId = null;
            isRunning = false;
            
            releaseWakeLock(); // Allow screen to sleep normally again
            window.speechSynthesis.cancel();
            resetUI();
        }

        // --- Event Listeners ---
        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);
        
        voiceToggle.addEventListener('change', (e) => {
            if (!e.target.checked) {
                window.speechSynthesis.cancel();
            }
        });
    </script>
</body>
</html>
